<title>My Social App</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&amp;display=swap">
<style>
:root{--bg:#000;--ink:#F2F2F2;--mu:#A3A3A3;--ln:#222;--a:#3DD6B5;--card:#111;--cb:#BFD0FF;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Hind Siliguri",system-ui,sans-serif;color-scheme:dark}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--a);outline-offset:2px}
#root{height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto;position:relative}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 12px 8px 16px;min-height:60px;border-bottom:1px solid var(--ln);flex:none}
header h1{margin:0;font-size:22px;font-weight:700}
.hb{min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;gap:4px}
.pill{border:1px solid #333;border-radius:22px;padding:0 12px;min-height:44px;font-weight:600;font-size:13px}
#main{flex:1;min-height:0;position:relative;overflow:hidden}
nav{display:flex;border-top:1px solid var(--ln);flex:none}
nav button{flex:1;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:600;color:var(--mu)}
nav button.on{color:var(--a)}
.av{border-radius:28%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex:none;overflow:hidden}
.feed{height:100%;overflow-y:auto;scroll-snap-type:y mandatory}
.post{height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column}
.top{display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;padding:10px 24px 8px;flex:none}
.top small{font-size:12px;color:var(--mu);margin-top:2px}.top b{font-size:15px}.top p{margin:0;font-size:13px;line-height:1.4;max-height:3.9em;overflow:hidden}
.media{width:100%;height:42%;max-height:340px;min-height:160px;flex:none;background:#1B2220;display:flex;align-items:center;justify-content:center;color:var(--mu);font-size:14px}
.media img,.media video{width:100%;height:100%;object-fit:cover}.avw{position:relative;display:inline-flex;flex:none}.od{position:absolute;right:-1px;bottom:-1px;width:30%;min-width:10px;height:30%;min-height:10px;border-radius:50%;background:#3DD6B5;border:2px solid #000}.pg{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.25);pointer-events:none}.pg i{display:block;height:100%;width:0;background:#3DD6B5;transition:width .3s linear}.act{color:var(--mu)}.act.on{color:#3DD6B5}
.acts{display:flex;align-items:center;gap:6px;padding:0 44px 0 12px;flex:none}
.acts button{min-height:44px;padding:0 8px;display:flex;align-items:center;gap:6px;font-weight:600;font-size:14px}
.acts span{margin-left:auto;font-size:12px;color:var(--mu)}
.cms{flex:1;min-height:0;overflow-y:auto;padding:2px 44px 8px 16px;display:flex;flex-direction:column;gap:10px}
.cms>small{color:var(--mu);font-size:12px}
.cm{display:flex;gap:8px;font-size:13px;line-height:1.4}.cm span{color:var(--mu)}
.cf{display:flex;align-items:center;gap:6px;padding:4px 44px 6px 12px;flex:none;border-top:1px solid var(--ln)}
.cf input{flex:1;min-height:40px;border-radius:12px;border:1px solid var(--ln);background:var(--card);padding:0 12px;font-size:14px}
.dots{position:absolute;right:10px;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;pointer-events:none}
.dots i{width:6px;height:6px;border-radius:3px;background:#444;transition:height .2s}.dots i.on{height:18px;background:var(--a)}
.empty{height:100%;display:flex;align-items:center;justify-content:center;color:var(--mu);padding:24px;text-align:center}
.list{height:100%;overflow-y:auto}
.row{width:100%;display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--ln);text-align:left}
